name: 米游社日历更新

# 控制时机
on:
  # push 时
  push:
    branches: ["main"]

  # 定时器
  schedule:
    - cron: "5 4,11-13 * * *"

  # 手动
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  # 同一时刻只保留一轮：新触发会立即取消上一轮未完成的 run，避免卡死的 run 把后续触发一直堵在队列里
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.file_check.outputs.exists }}
    steps:
      # 取当前版本
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get Custom
        uses: actions/checkout@v7
        with:
          repository: 'Dave-12138/cdns'
          path: "./cdns"
      - name: 配置 pages
        uses: actions/configure-pages@v6
      - name: 安装 pnpm 与 Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
      - name: 构建 日历
        run: pnpm build
      - name: 构建 fetcher
        run: pnpm run calendar-node:build
      # 拿数据：网络波动导致抓取失败是常态，故静默失败（不 fail 工作流、不发失败邮件）
      - name: 查询并合并数据
        continue-on-error: true
        run: |
          mv ./cdns/custom_fes.json ./custom_fes.json
          node ./node/fetch-calendar.cjs
      - name: 检查数据文件
        id: file_check
        run: |
          if [ -f "miyoushe-calendar.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::未获取到 miyoushe-calendar.json（多半是网络问题），静默跳过后续所有步骤，本轮不发布。"
          fi
      - name: move
        if: steps.file_check.outputs.exists == 'true'
        run: |
          mv miyoushe-calendar.json ./calendar/
          mv index.html ./calendar/
      # 上传要用的部分用于 pages
      - name: 上传 artifact
        if: steps.file_check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./calendar/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.success == 'true'
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
